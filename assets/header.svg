    <style>
      .ln { opacity: 0; animation: show 0.01s forwards; }
      .tw { clip-path: inset(0 100% 0 0); animation: type 0.7s steps(18) forwards; }
      .caret { animation: blink 1s steps(1) infinite; }
      .lens { animation: float 6s ease-in-out infinite; }
      @keyframes show { to { opacity: 1; } }
      @keyframes type { to { clip-path: inset(0 0 0 0); } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @media (prefers-reduced-motion: reduce) { .ln, .tw { animation-duration: 0s !important; animation-delay: 0s !important; } }
    </style>
