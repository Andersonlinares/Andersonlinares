<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="Vamos construir o seu sistema?">
  <title>Vamos construir o seu sistema?</title>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ee0f7"/>
      <stop offset="0.45" stop-color="#6aa8ff"/>
      <stop offset="1" stop-color="#b79bff"/>
    </linearGradient>
    <radialGradient id="blobA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.075"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.025"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.16"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="120" rx="24" fill="#07090e"/><ellipse cx="144" cy="12" rx="456" ry="90" fill="url(#blobA)"/><ellipse cx="1080" cy="24" rx="384" ry="84" fill="url(#blobB)"/><rect width="1200" height="120" rx="24" fill="url(#grid)"/>
  <text x="600" y="56" text-anchor="middle" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.8" fill="#f2f5fa">Vamos construir o seu <tspan fill="url(#grad)">sistema</tspan>?</text>
  <text x="600" y="88" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'SF Mono', Menlo, monospace" font-size="13" fill="#8b93a3">andersonlinares.dev@gmail.com  ·  Brasília, DF  ·  PT · ES · EN</text>
